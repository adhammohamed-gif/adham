name: Trim chapter videos

on:
  push:
    branches: [main]
    paths: [chapters.json, trim_video.py, .github/workflows/trim-chapters.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trim-chapter-videos
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install gdown==5.2.0 numpy==2.2.6 scipy==1.15.3
          npm install --prefix work/artifact @actions/artifact@2
      - name: Download recording and verify transcript alignment
        run: python trim_video.py prepare
      - name: Export and upload each chapter
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {spawnSync} = require('child_process');
            const root = process.env.GITHUB_WORKSPACE;
            const {DefaultArtifactClient} = require(path.join(root, 'work/artifact/node_modules/@actions/artifact'));
            const client = new DefaultArtifactClient();
            const config = JSON.parse(fs.readFileSync('chapters.json', 'utf8'));
            for (const chapter of config.chapters) {
              const processResult = spawnSync('python', ['trim_video.py', 'cut', '--id', chapter.id], {stdio: 'inherit'});
              if (processResult.error || processResult.status !== 0) {
                throw new Error(`Chapter ${chapter.id} export failed: ${processResult.error || processResult.status}`);
              }
              const dir = path.join(root, 'work/trim/exports', chapter.id);
              const files = fs.readdirSync(dir).map(name => path.join(dir, name));
              await client.uploadArtifact(`chapter-${chapter.id}`, files, dir,
                {retentionDays: 3, compressionLevel: 0});
              fs.rmSync(dir, {recursive: true});
              core.info(`Chapter ${chapter.id} uploaded successfully`);
            }
      - name: Write chapter report
        run: python trim_video.py report
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-index
          path: |
            work/trim/reports/
            work/trim/alignment.json
            chapters.json
          retention-days: 3
          if-no-files-found: error
      - name: Add download instructions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('chapters.json', 'utf8'));
            await core.summary.addHeading('Chapter videos are ready')
              .addRaw('Download chapter-01 through chapter-14 from Artifacts below. Extract each ZIP to get its MP4. Files expire after three days.\n\n')
              .addList(config.chapters.map(c => `${c.id}: ${c.title}`))
              .addRaw('\nCuts preserve original video quality. Boundaries extend to nearby keyframes and can include a few seconds of the adjacent session. Review the exported videos before publishing.\n')
              .write();
